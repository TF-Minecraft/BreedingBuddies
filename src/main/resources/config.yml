max-animals: 15
care-max: 200

min-loaded: 60s
decay-grace: 24h
offline-care: 8h
long-unload-force: 8h
milk-timer: 20m
milk-cooldown: 20m
wool-timer: 4h
shed-timer: 4h
shed-chance: 0.15
# Time between eggs from a loaded, mature, happy chicken.
egg-timer: 1h

affliction:
  mean: 6h
  min: 4h
  max: 8h

care:
  up:
    interval: 1m
    amount: 1
  down:
    interval: 10h
    amount: 1

grow-up: 1h

profession: farming

exp:
  min: 6
  max: 8

initial-genetic-max: 20
max-genetics: 1000
# Meat portions from effective genetics, before the closing bone.
# Poultry raises this floor to two legs and one filet (carve-sequences.yml).
min-roast-cuts: 1
# Bump this string to wild-reset animals with a missing or old id (genetics + care).
stats-revision: "1"
# Respawn an owned animal from its last snapshot when a crash or forced stop loses it from the world save.
restore-lost-animals: true

breeding:
  # Bigger = larger gene bump per generation.
  genetic-variance-multiplier: 0.2
  # Bigger = slower climb when parents already have high genetics.
  genetic-slowdown-divisor: 0.6
  # Extra gene points at full parent care: this * max-genetics (0.02 -> +20 at 1000).
  care-influence: 0.02
  # Breeding-food stars scale that bonus (1★ = 20% … 5★ = 100%, same roll as before).
  # Universal feed and items with no cooking quality count as a full bonus.

amount-from-genetics:
  - min: 0
    roast-cuts: 1
    wool: 1
    secondary-extra: 0
  - min: 125
    roast-cuts: 2
    wool: 1
    secondary-extra: 0
  - min: 250
    roast-cuts: 3
    wool: 1
    secondary-extra: 0
  - min: 375
    roast-cuts: 4
    wool: 2
    secondary-extra: 0
  - min: 500
    roast-cuts: 5
    wool: 2
    secondary-extra: 1
  - min: 625
    roast-cuts: 6
    wool: 3
    secondary-extra: 1
  - min: 750
    roast-cuts: 7
    wool: 3
    secondary-extra: 2
  - min: 875
    roast-cuts: 8
    wool: 4
    secondary-extra: 2

items:
  tame: m.pets.taming_item
  co-own: m.pets.coownership_item
  feed: m.pets.universal_feed
  glove: m.pets.caring_item
  neuter: m.pets.neutering_item
  inspect: ""
  mount-stats: ""

remove-unowned:
  - COW
  - PIG
  - SHEEP
  - CHICKEN
  - GOAT
  - HORSE
  - DONKEY
  - MULE
  - CAMEL
  - LLAMA
  - CAT
  - OCELOT
  - WOLF

