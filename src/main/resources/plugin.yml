main: net.tfminecraft.breedingbuddies.BreedingBuddies
api-version: '1.21.10'
name: BreedingBuddies
version: ${project.version}
author: Nowko
depend: [TLibs, Cooking]
softdepend: [RPCharacters, MMOCore]
commands:
  breedingbuddies:
    description: BreedingBuddies staff commands
    usage: /breedingbuddies reload | spawn <type> [genetics] [care] | save
    aliases: [bb]
    permission: breedingbuddies.admin
  animals:
    description: List the animals you own and where they were last seen
    usage: /animals
    aliases: [livestock]

permissions:
  breedingbuddies.admin:
    description: Staff access to BreedingBuddies commands and to other characters' animals
    default: op
